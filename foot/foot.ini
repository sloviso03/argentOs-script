regular5=c084fc  # magenta
regular6=22d3ee  # cyan
regular7=e4e4e7  # white

bright0=52525b   # bright black
bright1=ef4444   # bright red
bright2=34d399   # bright green
bright3=fde047   # bright yellow
bright4=3b82f6   # bright blue
bright5=a855f7   # bright magenta
